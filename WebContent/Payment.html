<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TrackMate | Payment</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <nav class="topnav">
    <div class="brand">TrackMate</div>
    <button class="nav-toggle" aria-label="Menu">&#9776;</button>
    <div class="links">
      <a href="userhome">Home</a>
      <a href="userviewtrainfwd">View Trains</a>
      <a href="trainbwstnfwd">Between Stations</a>
      <a href="bookingdetails">Booking History</a>
      <a href="fareenqfwd">Fare Enquiry</a>
      <a href="useravailfwd">Availability</a>
      <a href="usersearchtrain">Search</a>
      <a href="userprofile">Profile</a>
    </div>
    <a href="userlogout" class="logout">Log Out</a>
  </nav>
  <div class="page">
    <div class="page-heading">Card Payment</div>
    <div class="page-subtext">Enter your card details to confirm the booking.</div>
    <div class="card">
      <form action="booktrains" method="post">
        <div class="field"><label>Card Number</label><input type="tel" placeholder="Valid card number" required></div>
        <div class="field"><label>Expiry (MM / YY)</label><input type="tel" placeholder="MM / YY" required></div>
        <div class="field"><label>CVC</label><input type="tel" placeholder="CVC" required></div>
        <div class="field"><label>Card Owner</label><input type="text" placeholder="Name on card" required></div>
        <button type="submit" class="btn accent">Confirm Payment</button>
      </form>
    </div>
  <script src="assets/js/enhance.js"></script>
